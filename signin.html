<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | KORRA</title>

  <link rel="icon" type="image/png" href="/assets/Korra_logo_final.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- --- TRUE INDUSTRIAL SELF-HOSTING --- -->
  <script src="/assets/supabase.min.js"></script>
  <script src="https://sdk.snapkit.com/js/v1/login.js" defer crossorigin="anonymous"></script>
  <script src="/snap-login.js" defer></script>

  <style>
    :root {
      --Obsidian: #000000;
      --Mint: #C6FF00;
      --Glass: rgba(255, 255, 255, 0.04);
      --Glass-Border: rgba(255, 255, 255, 0.1);
      --Neutral-400: #A3A3A3;
      --White: #FFFFFF;
      --S-24: 24px; --S-32: 32px; --S-48: 48px;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--Obsidian); color: var(--White); font-family: 'Inter', sans-serif; overflow: hidden; }

    .split-layout { display: grid; grid-template-columns: 1fr 1.2fr; width: 100%; height: 100vh; }

    .side-panel {
        background: url('/assets/A faster way to measure, store, and share fit data..png') center center / cover no-repeat;
        border-right: 1px solid var(--Glass-Border); position: relative;
    }
    .side-overlay {
        position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
        display: flex; flex-direction: column; justify-content: flex-end; padding: 64px;
    }
    .side-overlay h1 { font-size: 48px; font-weight: 900; line-height: 1.1; letter-spacing: -0.04em; color: #fff; }
    .side-overlay p { font-size: 18px; color: var(--Mint); margin-top: 16px; font-weight: 600; }

    .form-panel { display: flex; align-items: center; justify-content: center; padding: 64px; overflow-y: auto; background: #000; }
    .form-container { width: 100%; max-width: 440px; }

    @media (max-width: 1000px) {
      html, body { overflow: auto; height: auto; }
      .split-layout { grid-template-columns: 1fr; min-height: 100vh; height: auto; overflow: visible; }
      .side-panel { display: none; }
      .form-panel { padding: 48px 24px; align-items: center; justify-content: center; min-height: 100vh; height: auto; }
    }

    .logo-area { display: flex; align-items: center; gap: 16px; margin-bottom: 48px; text-decoration: none; color: inherit; }
    .logo-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--Mint); transform: rotate(-8deg); }
.logo-text { font-size: 20px; font-weight: 900; letter-spacing: -0.05em; }

    h2 { font-size: 32px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.03em; }
    .sub-p { color: var(--Neutral-400); margin-bottom: 40px; font-size: 15px; }

    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-size: 10px; font-weight: 900; text-transform: uppercase; color: var(--Neutral-400); letter-spacing: 0.1em; margin-bottom: 8px; }
    .form-input {
      width: 100%; height: 52px; background: rgba(255,255,255,0.05); border: 1px solid var(--Glass-Border);
      border-radius: 12px; padding: 0 16px; color: #fff; font-size: 14px; transition: 0.2s;
    }
    .form-input:focus { outline: none; border-color: var(--Mint); background: rgba(255,255,255,0.08); }

    .btn {
      width: 100%; height: 52px; background: var(--Mint); color: var(--Obsidian); border: none;
      border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: #D9FF4D; transform: translateY(-1px); }

    .btn-google {
      width: 100%; height: 52px; background: #fff; color: #333; border: none;
      border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px;
    }
    .btn-google:hover { background: #f5f5f5; transform: translateY(-1px); }
    .btn-google svg { width: 20px; height: 20px; }

    .divider { display: flex; align-items: center; margin: 24px 0; color: var(--Neutral-400); font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--Glass-Border); }
    .divider span { padding: 0 16px; }

    .switch-link { display: block; text-align: center; margin-top: 24px; font-size: 13px; color: var(--Neutral-400); text-decoration: none; transition: 0.2s; }
    .switch-link span { color: var(--Mint); font-weight: 700; }
    .switch-link:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="split-layout">
    <!-- LEFT: SIDE PANEL -->
    <div class="side-panel">
      <div class="side-overlay">
        <h1>Welcome Back.</h1>
        <p>Your AI Body Scanner is ready.</p>
      </div>
    </div>

    <!-- RIGHT: FORM PANEL -->
    <div class="form-panel">
      <div class="form-container">
<a href="/" class="logo-area">
          <img src="/assets/Korra_logo_final.png" alt="Korra" style="height:40px; width:auto;">
          <span style="font-size:22px; font-weight:900; letter-spacing:-0.03em; color:var(--Mint);">Korra</span>
        </a>

        <h2>Sign In</h2>
        <p class="sub-p">Access your dashboard to manage measurements.</p>

        <form id="signInForm">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-input" id="inEmail" placeholder="name@email.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="inPass" placeholder="••••••••" required>
            <div style="text-align:right; margin-top:10px;">
              <a href="#" id="forgotLink" style="font-size:13px; color:var(--Neutral-400); text-decoration:none;">Forgot Password?</a>
            </div>
          </div>
          <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="divider"><span>or</span></div>

        <!-- Snapchat Login -->
        <div id="snap-login-btn" style="margin-bottom:16px;"></div>
        <button type="button" class="btn-snapchat" onclick="window.SnapLoginKit?.mountButton('snap-login-btn')" style="width:100%; height:52px; background:#FFFC00; color:#000; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:12px; transition:0.2s;">
          <svg style="width:24px; height:24px;" viewBox="0 0 24 24" fill="#000"><path d="M12.206.793c.99 0 4.347.276 5.93 3.821.529 1.193.403 3.219.299 4.847l-.003.06c-.012.18-.022.345-.03.51.075.045.203.09.401.09.3-.016.659-.12 1.033-.301.165-.088.344-.104.464-.104.182 0 .359.029.509.09.45.149.734.479.734.838.015.449-.39.839-1.213 1.168-.089.029-.209.075-.344.119-.45.135-1.139.36-1.139 1.078 0 .195.082.39.195.569.39.614 1.526.958 2.788.958.106 0 .21-.015.316-.029a3.525 3.525 0 0 1 1.199.39c.225.12.374.27.464.39.3.375.255.869-.075 1.273-.614.765-2.084 1.259-4.063 1.259h-.12c-1.243 0-2.61-.36-3.749-1.004l-.06-.03c-.585-.345-1.14-.555-1.754-.555-.27 0-.54.045-.81.135l-.255.09c-.375.135-.765.27-1.17.27-.15 0-.285-.015-.42-.06a3.06 3.06 0 0 1-.401-.165c-.225-.12-.39-.27-.51-.42-.36-.45-.345-.93.045-1.304.375-.375.99-.6 1.62-.6.18 0 .36.03.54.06.105.015.21.045.315.06l.24.03c.165-.015.33-.045.495-.075.375-.075.735-.15 1.065-.15.12 0 .24.015.36.03.585.09 1.08.345 1.44.735l.15.165c.255.285.6.495.99.57.18.03.36.045.54.045.165 0 .33-.015.48-.045.285-.06.51-.18.66-.33.075-.075.135-.165.18-.255.045-.075.09-.165.12-.24.045-.12.075-.24.09-.36.03-.06.045-.135.045-.21 0-.045-.015-.09-.03-.135a.854.854 0 0 0-.21-.27.972.972 0 0 0-.33-.165 2.388 2.388 0 0 0-.42-.075 6.848 6.848 0 0 0-.51-.03c-.24 0-.48.015-.72.06-.06.015-.12.015-.18.03-.3.06-.57.18-.795.33-.12.09-.225.195-.315.315-.165.21-.27.45-.3.69-.015.12-.03.24-.03.36 0 .09.015.18.03.27.06.27.195.51.375.69.18.18.42.3.675.36.09.03.18.045.27.045.075 0 .15-.015.21-.03.045-.015.09-.015.135-.03.165-.045.315-.135.435-.255.09-.09.165-.195.225-.315.06-.135.09-.27.09-.42 0-.075-.015-.15-.045-.225-.06-.165-.165-.315-.3-.435a1.54 1.54 0 0 0-.465-.27c-.18-.075-.375-.12-.57-.135-.105-.015-.21-.015-.315-.015-.045 0-.09.015-.135.015-.39.03-.75.135-1.065.3-.075.045-.15.09-.21.15-.09.09-.165.195-.21.315-.045.135-.06.27-.06.42v.15c0 .18.03.36.09.525.075.21.21.39.39.51.18.12.39.195.615.225.09.015.18.015.27.015.075 0 .15-.015.225-.03.18-.045.36-.12.51-.24.075-.06.15-.135.21-.225.06-.09.09-.195.12-.3.015-.06.03-.135.03-.21 0-.135-.015-.27-.06-.39-.06-.195-.165-.375-.315-.51-.15-.135-.33-.24-.525-.3-.075-.03-.165-.045-.255-.045-.06 0-.12.015-.18.03-.195.06-.375.165-.525.3-.06.06-.12.135-.165.225-.06.12-.09.24-.09.375v.06c0 .09.015.18.03.27.06.24.195.45.39.585.18.135.405.225.645.255.06.015.135.015.21.015.15 0 .3-.015.45-.06.27-.075.51-.21.69-.39.09-.09.165-.195.225-.33.045-.105.075-.21.09-.33.015-.06.03-.135.03-.21v-.06c0-.135-.03-.27-.075-.39-.09-.24-.24-.45-.435-.6-.195-.15-.42-.255-.675-.315-.09-.03-.18-.045-.27-.045-.045 0-.09.015-.135.03-.225.045-.435.135-.615.27-.09.06-.165.135-.24.225-.09.12-.15.255-.18.39-.03.12-.045.255-.045.39v.06c0 .09.015.18.03.27.06.21.18.405.36.54.18.135.39.225.615.27.09.015.18.015.27.015.12 0 .24-.015.36-.045.27-.075.51-.21.69-.39.09-.09.165-.195.225-.33.045-.105.075-.21.09-.33.015-.06.03-.135.03-.21v-.06c0-.135-.03-.27-.075-.39-.09-.24-.24-.45-.435-.6-.195-.15-.42-.255-.675-.315-.09-.03-.18-.045-.27-.045-.045 0-.09.015-.135.03-.225.045-.435.135-.615.27z"/></svg>
          Sign in with Snapchat
        </button>

        <a href="/signup" id="signupLink" class="switch-link">Don't have an account? <span>Sign Up</span></a>

        <div id="forgotPanel" style="display:none;">
          <p class="sub-p">Enter your account email and we'll send a secure reset link.</p>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-input" id="resetEmail" placeholder="name@email.com" required>
          </div>
          <button type="button" id="sendResetBtn" class="btn">Send Reset Link</button>
          <a href="#" id="backToSignIn" class="switch-link">Back to <span>Sign In</span></a>
        </div>
      </div>
</div>
  </div>

  <script>
    (function() {
      const ADMIN_LIST = ['springbionics@gmail.com', 'admin@korra.work'];

      function initSupabase() {
        if (typeof window.supabase === 'undefined') {
          setTimeout(initSupabase, 500);
          return;
        }
        const config = {
          supabaseUrl: 'https://blsettabymllulsxtziw.supabase.co',
          supabaseKey: 'sb_publishable_miCOIXHtlxLkfDgpwE0N-g_BA1Q-x8y'
        };
        const supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseKey);

        // Already signed in → skip to dashboard
        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session) {
            const params = new URLSearchParams(window.location.search);
            window.location.href = params.get('next') || '/dashboard';
          }
        });

        document.getElementById('signInForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('inEmail').value;
          const password = document.getElementById('inPass').value;
          const btn = e.target.querySelector('button');
          btn.textContent = 'Signing you in...';
          btn.style.opacity = '0.7';

          const { error } = await supabase.auth.signInWithPassword({ email, password });

          if (error) {
            alert(error.message);
            btn.textContent = 'Sign In';
            btn.style.opacity = '1';
          } else {
            // Check onboarding status
            const { data: { user } } = await supabase.auth.getUser();
            const { data: profile } = await supabase
              .from('profiles')
              .select('onboarding_completed_at')
              .eq('id', user.id)
              .single();

            if (!profile || !profile.onboarding_completed_at) {
              window.location.href = '/onboarding';
              return;
            }

            const params = new URLSearchParams(window.location.search);
            const next = params.get('next');
            if (next) window.location.href = next;
            else if (ADMIN_LIST.includes(email.toLowerCase())) window.location.href = '/admin';
            else window.location.href = '/dashboard';
          }
        });

        // --- FORGOT PASSWORD (inline panel) ---
        const forgotLink = document.getElementById('forgotLink');
        const backToSignIn = document.getElementById('backToSignIn');
        const signInForm = document.getElementById('signInForm');
        const forgotPanel = document.getElementById('forgotPanel');
        const signupLink = document.getElementById('signupLink');
        const sendResetBtn = document.getElementById('sendResetBtn');
        const resetEmail = document.getElementById('resetEmail');

        function toggleForgot(show) {
          signInForm.style.display = show ? 'none' : 'block';
          forgotPanel.style.display = show ? 'block' : 'none';
          signupLink.style.display = show ? 'none' : 'block';
          if (show) { resetEmail.value = document.getElementById('inEmail').value; resetEmail.focus(); }
        }

        forgotLink.addEventListener('click', (e) => { e.preventDefault(); toggleForgot(true); });
        backToSignIn.addEventListener('click', (e) => { e.preventDefault(); toggleForgot(false); });

        sendResetBtn.addEventListener('click', async () => {
          const email = resetEmail.value.trim();
          if (!email) { alert('Please enter your email address.'); return; }
          sendResetBtn.textContent = 'Sending...';
          sendResetBtn.style.opacity = '0.7';
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/reset-password'
          });
          sendResetBtn.textContent = 'Send Reset Link';
          sendResetBtn.style.opacity = '1';
          if (error) {
            alert(error.message);
          } else {
            forgotPanel.innerHTML = '<div style="width:80px;height:80px;background:var(--Mint);color:var(--Obsidian);border-radius:50%;margin:0 auto 32px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 0 40px rgba(198,255,0,0.3)">✓</div>' +
              '<h2>Check your email</h2>' +
              '<p class="sub-p">If an account exists for <strong>' + email + '</strong>, a reset link is on its way. Check your inbox (and spam folder).</p>' +
              '<a href="/signin" class="switch-link">Back to <span>Sign In</span></a>';
          }
        });
      }
      initSupabase();
    })();
  </script>
</body>
</html>
