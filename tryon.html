<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Try-On | KORRA AI</title>
  
  <!-- Content Security Policy for Camera Kit -->
  <meta http-equiv="Content-Security-Policy" content="
    connect-src 'self' https://*.snapar.com https://*.supabase.co https://esm.sh https://*.esm.sh https://*.sc-cdn.net;
    script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://*.sc-cdn.net https://esm.sh blob:;
    media-src 'self' blob:;
  ">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #000;
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      background: #0a0a0a;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      z-index: 100;
    }
    .header-logo { display: flex; align-items: center; gap: 10px; }
    .header-title { font-size: 14px; font-weight: 700; color: #c6ff00; letter-spacing: 0.1em; text-transform: uppercase; }
    .header-badge {
      font-size: 10px; padding: 3px 8px;
      background: rgba(198,255,0,0.15); border: 1px solid rgba(198,255,0,0.3);
      border-radius: 99px; color: #c6ff00; font-weight: 600;
    }
    .header-link {
      color: #737373; text-decoration: none; font-size: 13px;
      display: flex; align-items: center; gap: 6px; transition: color 0.2s;
    }
    .header-link:hover { color: #fff; }
    .header-link svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ── Main Layout ── */
    .main-container {
      display: flex;
      height: calc(100dvh - 52px);
      overflow: hidden;
    }

    /* ── Camera Section ── */
    .camera-section {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .canvas-container {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    #tryon-canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* Camera status pill */
    .camera-status {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      color: #fff;
      z-index: 10;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      backdrop-filter: blur(10px);
      pointer-events: none;
      white-space: nowrap;
    }

    /* ── Camera Controls — Left Vertical Pill ── */
    .camera-controls {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 99px;
      padding: 12px;
      z-index: 60;
    }
    .capture-btn {
      width: 68px; height: 68px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      flex-shrink: 0;
    }
    .capture-btn::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #fff;
    }
    .capture-btn:active { transform: scale(0.9); }

    .control-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.08);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .control-btn:hover { background: rgba(255,255,255,0.18); }
    .control-btn.active { background: rgba(198,255,0,0.2); color: #c6ff00; }
    .control-btn svg {
      width: 20px; height: 20px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── Navigation Arrows ── */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 55;
    }
    .nav-arrow:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
    .nav-arrow svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-arrow-prev { left: 80px; }
    .nav-arrow-next { right: 16px; }

    /* ── Outfit Strip — Bottom thumbnails ── */
    .outfit-strip-container {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      z-index: 50;
      padding: 0 0 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
    }
    .outfit-strip {
      display: flex;
      gap: 12px;
      padding: 12px 24px 0;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
    }
    .outfit-strip::-webkit-scrollbar { display: none; }

    .outfit-chip {
      flex: 0 0 72px;
      width: 72px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(30,30,30,0.8);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      position: relative;
    }
    .outfit-chip-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }
    .outfit-chip-label {
      font-size: 9px;
      color: rgba(255,255,255,0.7);
      text-align: center;
      padding: 3px 2px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .outfit-chip:hover { border-color: rgba(255,255,255,0.4); transform: scale(1.06); }
    .outfit-chip.active {
      border-color: #c6ff00;
      box-shadow: 0 0 16px rgba(198,255,0,0.3);
      transform: scale(1.08);
    }

    /* Pagination dots */
    .outfit-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding-top: 10px;
    }
    .outfit-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.2s;
    }
    .outfit-dot.active { background: #c6ff00; }

    /* ── Sidebar ── */
    .sidebar {
      width: 340px;
      background: #0a0a0a;
      border-left: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .sidebar-subtitle { font-size: 13px; color: #737373; }

    .sidebar-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #525252;
      padding: 20px 20px 10px;
    }

    .sidebar-outfit-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 12px;
    }

    .sidebar-outfit-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      cursor: pointer;
      transition: all 0.2s;
    }
    .sidebar-outfit-card:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
    .sidebar-outfit-card.active {
      border-color: #c6ff00;
      background: rgba(198,255,0,0.06);
    }
    .sidebar-outfit-thumb {
      width: 64px; height: 64px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      background: rgba(255,255,255,0.05);
    }
    .sidebar-outfit-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .sidebar-outfit-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .sidebar-outfit-name { font-size: 14px; font-weight: 600; }
    .sidebar-outfit-category { font-size: 12px; color: #737373; }

    /* Recent Captures */
    .sidebar-captures { padding: 0 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .sidebar-capture-thumb {
      width: 72px; height: 72px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.06);
      transition: border-color 0.2s;
    }
    .sidebar-capture-thumb:hover { border-color: rgba(255,255,255,0.2); }
    .sidebar-capture-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── Loading Overlay ── */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      gap: 16px;
    }
    .loading-overlay.hidden { display: none; }
    .loading-spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(198,255,0,0.2);
      border-top-color: #c6ff00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: #a3a3a3; }

    /* ── Mobile Responsive ── */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .nav-arrow { display: none; }
      .camera-controls { left: 12px; }
      .capture-btn { width: 60px; height: 60px; }
      .control-btn { width: 38px; height: 38px; }
      .outfit-chip { flex: 0 0 60px; width: 60px; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-logo">
      <span class="header-title">KORRA AI</span>
      <span class="header-badge">BETA</span>
    </div>
    <a href="/dashboard.html" class="header-link">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back to Dashboard
    </a>
  </header>
  
  <!-- Main Container -->
  <div class="main-container">
    <!-- Camera Section -->
    <div class="camera-section">
      <div class="canvas-container">
        <canvas id="tryon-canvas"></canvas>
        <div class="camera-status" id="camera-status">Initializing...</div>

        <!-- Navigation Arrows -->
        <button class="nav-arrow nav-arrow-prev" id="btn-prev" title="Previous outfit">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="nav-arrow nav-arrow-next" id="btn-next" title="Next outfit">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </button>

        <!-- Camera Controls — Left Vertical Pill -->
        <div class="camera-controls">
          <button class="control-btn" id="btn-flip-camera" title="Flip Camera">
            <svg viewBox="0 0 24 24">
              <path d="M20 7l-4-4v3H8a4 4 0 000 8h1"/>
              <path d="M4 17l4 4v-3h8a4 4 0 000-8h-1"/>
            </svg>
          </button>
          <button class="capture-btn" id="btn-capture" title="Capture Photo"></button>
          <button class="control-btn" id="btn-pause" title="Pause">
            <svg viewBox="0 0 24 24">
              <rect x="6" y="4" width="4" height="16" rx="1"/>
              <rect x="14" y="4" width="4" height="16" rx="1"/>
            </svg>
          </button>
          <button class="control-btn" id="btn-remove-lens" title="Remove Outfit">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
          </button>
        </div>

        <!-- Outfit Strip — Bottom thumbnails -->
        <div class="outfit-strip-container">
          <div class="outfit-strip" id="outfit-strip"></div>
          <div class="outfit-dots" id="outfit-dots"></div>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Clothing Try-On</div>
        <div class="sidebar-subtitle">Select an outfit to try on</div>
      </div>
      <div class="sidebar-section-label">Outfits</div>
      <div class="sidebar-outfit-list" id="sidebar-outfit-list"></div>
      <div class="sidebar-section-label">Recent Captures</div>
      <div class="sidebar-captures" id="sidebar-captures">
        <div style="padding: 8px 8px; font-size: 12px; color: #525252;">No captures yet</div>
      </div>
    </div>
  </div>
  
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text">Launching KORRA VTO...</div>
  </div>
  
  <!-- Camera Kit Scripts -->
  <script src="/camerakit-config.v2.js"></script>
  <script type="module" src="/camerakit-integration.v2.js"></script>
  <script type="module" src="/camera-kit-tryon-app.v2.js"></script>
</body>
</html>
