<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Try-On | KORRA AI</title>
  
  <!-- Content Security Policy for Camera Kit -->
  <meta http-equiv="Content-Security-Policy" content="
    connect-src 'self' https://*.snapar.com https://*.supabase.co https://esm.sh https://*.esm.sh https://*.sc-cdn.net;
    script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://*.sc-cdn.net https://esm.sh blob:;
    media-src 'self' blob:;
  ">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #000;
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh;
      overflow: hidden;
    }
    
    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }
    
    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .header-logo img { height: 32px; }
    
    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: #c6ff00;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    
    .header-badge {
      font-size: 10px;
      padding: 4px 8px;
      background: rgba(198, 255, 0, 0.15);
      border: 1px solid rgba(198, 255, 0, 0.3);
      border-radius: 99px;
      color: #c6ff00;
      font-weight: 600;
    }
    
    /* Main Container */
    .main-container {
      position: relative;
      height: 100dvh;
      display: flex;
      background: #000;
    }
    
    /* Camera Section */
    .camera-section {
      flex: 1;
      position: relative;
      background: transparent;
      display: flex;
      flex-direction: column;
    }
    
    .canvas-container {
      flex: 1;
      position: relative;
      z-index: 1;
      overflow: visible;
    }
    
    #tryon-canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .camera-status {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 10px;
      color: #fff;
      z-index: 10;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      backdrop-filter: blur(10px);
    }
    
    /* Camera Controls — Vertical Left-Side Pill */
    .camera-controls {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      padding: 12px;
      z-index: 60;
    }
    
    .capture-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      flex-shrink: 0;
    }
    
    .capture-btn::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #fff;
    }
    
    .capture-btn:active { transform: scale(0.9); }
    
    .control-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    
    .control-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .control-btn.active {
      background: rgba(198, 255, 0, 0.2);
      color: #c6ff00;
    }
    
    .control-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      gap: 16px;
    }
    
    .loading-overlay.hidden { display: none; }
    
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(198, 255, 0, 0.2);
      border-top-color: #c6ff00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .loading-text { font-size: 14px; color: #a3a3a3; }

    /* Outfit Strip — Horizontal scroll at bottom */
    .outfit-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
    }
    .outfit-strip::-webkit-scrollbar { display: none; }

    .outfit-chip {
      flex: 0 0 52px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }

    .outfit-chip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .outfit-chip:hover {
      border-color: rgba(255, 255, 255, 0.5);
      transform: scale(1.1);
    }

    .outfit-chip.active {
      border-color: #c6ff00;
      box-shadow: 0 0 16px rgba(198, 255, 0, 0.3);
      transform: scale(1.15);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-logo">
      <span class="header-title">KORRA AI</span>
      <span class="header-badge">VTO PRO</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <a href="/" style="color: #737373; text-decoration: none; font-size: 12px;">← Exit</a>
    </div>
  </header>
  
  <!-- Main Container -->
  <div class="main-container">
    <div class="camera-section">
      <div class="canvas-container">
        <canvas id="tryon-canvas"></canvas>
        <div class="camera-status" id="camera-status">Initializing...</div>

        <!-- Outfit Strip — Bottom horizontal scroll -->
        <div class="outfit-strip" id="outfit-strip"></div>

        <!-- Camera Controls — Vertical Left-Side Pill -->
        <div class="camera-controls">
          <button class="control-btn" id="btn-flip-camera" title="Flip Camera">
            <svg viewBox="0 0 24 24">
              <path d="M20 7l-4-4v3H8a4 4 0 000 8h1"/>
              <path d="M4 17l4 4v-3h8a4 4 0 000-8h-1"/>
            </svg>
          </button>
          <button class="capture-btn" id="btn-capture" title="Capture Photo"></button>
          <button class="control-btn" id="btn-pause" title="Pause">
            <svg viewBox="0 0 24 24">
              <rect x="6" y="4" width="4" height="16" rx="1"/>
              <rect x="14" y="4" width="4" height="16" rx="1"/>
            </svg>
          </button>
          <button class="control-btn" id="btn-remove-lens" title="Remove Outfit">
            <svg viewBox="0 0 24 24">
              <line x1="4" y1="4" x2="20" y2="20"/>
              <line x1="20" y1="4" x2="4" y2="20"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text">Launching KORRA VTO...</div>
  </div>
  
  <!-- Camera Kit Scripts -->
  <script src="/camerakit-config.v2.js"></script>
  <script type="module" src="/camerakit-integration.v2.js"></script>
  <script type="module" src="/camera-kit-tryon-app.v2.js"></script>
</body>
</html>
